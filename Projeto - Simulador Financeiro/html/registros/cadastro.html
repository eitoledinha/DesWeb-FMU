<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro</title>
  <link rel="stylesheet" href="../../css/Styles.css"/>
</head>
<body class="body-login-cadastro">

  <div class="conteudo-cadastro">
    <h1>CRIE SEU CADASTRO</h1>
    
    <div class="cadastro-box">
      <form onsubmit="validarCadastro(event)">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required />

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required />
   
        <button type="submit" class="button-link" style="border: none; cursor: pointer;">
          CONTINUAR
        </button>
      </form>
    </div>
  </div>

  <div class="imagem">
    <img src="../../img/Login.png" alt="Ilustração MoneyMap">
  </div>

  <div id="modalFeedback" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modalTitulo">CADASTRO CONCLUÍDO!</h2>
      <div id="modalIcone" class="modal-icone-sucesso">
         <svg id="svgCheck" viewBox="0 0 52 52" style="display:none; width:80px; fill:none; stroke:#2563eb; stroke-width:5;">
           <circle cx="26" cy="26" r="25" fill="#2563eb" opacity="0.1"/>
           <path stroke-linecap="round" d="M14 27l7 7 16-16" stroke="#2563eb"/>
         </svg>
         <svg id="svgErro" viewBox="0 0 52 52" style="display:none; width:80px; fill:none; stroke:#dc2626; stroke-width:5;">
           <circle cx="26" cy="26" r="25" fill="#dc2626" opacity="0.1"/>
           <path stroke-linecap="round" d="M16 16l20 20M36 16L16 36" stroke="#dc2626"/>
         </svg>
      </div>
      <p id="modalMensagem">Seu cadastro foi realizado com sucesso.</p>
      <button id="modalBotao" class="button-link" style="border:none; margin-top:20px;">OK</button>
    </div>
  </div>

  <script>
    function validarCadastro(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim().toLowerCase();
      const modal = document.getElementById('modalFeedback');
      const titulo = document.getElementById('modalTitulo');
      const mensagem = document.getElementById('modalMensagem');
      const botao = document.getElementById('modalBotao');
      const svgCheck = document.getElementById('svgCheck');
      const svgErro = document.getElementById('svgErro');

      let usuariosCadastrados = JSON.parse(localStorage.getItem('usuarios')) || [];

      if (usuariosCadastrados.includes(email)) {
        titulo.innerText = "ERRO - CADASTRO";
        titulo.style.color = "#dc2626";
        mensagem.innerText = "Esse usuário já existe em nosso sistema!";
        svgCheck.style.display = "none";
        svgErro.style.display = "block";
        
        botao.onclick = function() {
          modal.style.display = "none";
        };
      } else {
        usuariosCadastrados.push(email);
        localStorage.setItem('usuarios', JSON.stringify(usuariosCadastrados));

        titulo.innerText = "CADASTRO CONCLUÍDO!";
        titulo.style.color = "#6937d9";
        mensagem.innerText = "Seu cadastro foi realizado com sucesso.";
        svgCheck.style.display = "block";
        svgErro.style.display = "none";

        botao.onclick = function() {
          window.location.href = '../Dashboard.html';
        };
      }

      modal.style.display = "flex";
    }
  </script>

</body>
</html>
