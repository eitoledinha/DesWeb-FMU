<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body class="container cadastro">

  <div class="conteudo-cadastro">
    <h1>FAÇA SEU LOGIN</h1>
    
    <div class="cadastro-box">
      <form onsubmit="window.location.href='../ProjetoDevWeb/simulador.html'; return false;">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required />

        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required />

        <div style="margin-top: 15px; margin-bottom: 15px; text-align: left;">
          <a href="./cadastro.html" style="color: #3b3bf3; font-size: 0.85rem; text-decoration: none; font-weight: bold; opacity: 0.8;">
            AINDA NÃO TEM CONTA? CADASTRE-SE JÁ
          </a>
        </div>
   
        <button type="submit" class="button-link" style="border: none; cursor: pointer;">
          CONTINUAR
        </button>
      </form>
    </div>
  </div>

  <div class="imagem">
    <img src="../img/Login.png" alt="Ilustração MoneyMap">
  </div>

</body>
</html>
