<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rendas</title>
    <link rel="stylesheet" href="CSS/EstiloRendas.css?v=3">
  </head>
  <body>
    <div class="centro">
      <h1>RENDAS</h1>
      <p class="frase">
        Informe o valor do seu salário bruto que o simulador calculará o desconto no
        INSS (caso seja aplicável).<br />
        Outras rendas, como freelancers, bicos, comissão etc (caso haja).
      </p>

      <div class="option">
        <div class="input-box">
          <h2>Salário Bruto</h2>
          <input type="text" id="salario" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)">
        </div>
        <div class="input-box">
          <h2>Outras Rendas</h2>
          <input type="text" id="outras" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)">
        </div>
      </div>
      
      <button class="botao" onclick="prosseguirRenda()">CONTINUAR</button>
    </div>
    
    <script>
      // Função auxiliar local para formatar entrada do usuário como moeda
      function formatarMoeda(input) {
        let valor = input.value.replace(/\D/g, "");
        valor = (valor / 100).toFixed(2) + "";
        valor = valor.replace(".", ",");
        valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        input.value = valor ? "R$ " + valor : "";
      }

      function limparMascara(valorStr) {
        if (!valorStr) return 0;
        let limpo = valorStr.replace("R$", "").replace(/\./g, "").replace(",", ".").trim();
        return parseFloat(limpo) || 0;
      }

      document.addEventListener("DOMContentLoaded", function() {
        const dadosSalvos = localStorage.getItem('dadosSimulacaoEdicao');
        if (dadosSalvos) {
          const dados = JSON.parse(dadosSalvos);
          
          // Preenche os campos caso existam detalhes salvos na estrutura
          if(dados.detalheRendas) {
            document.getElementById('salario').value = dados.detalheRendas.salario || "";
            document.getElementById('outras').value = dados.detalheRendas.outras || "";
          } else {
            // Fallback inteligente baseado no campo simples vindo do dashboard
            if (dados.contrato && (dados.contrato.toLowerCase() === 'clt' || dados.contrato.toLowerCase() === 'contrato')) {
              document.getElementById('salario').value = "R$ " + parseFloat(dados.recebido || 0).toLocaleString('pt-BR');
            } else {
              document.getElementById('outras').value = "R$ " + parseFloat(dados.recebido || 0).toLocaleString('pt-BR');
            }
          }
        }
      });

      function prosseguirRenda() {
        const salarioTexto = document.getElementById('salario').value;
        const outrasTexto = document.getElementById('outras').value;
        
        const vSalario = limparMascara(salarioTexto);
        const vOutras = limparMascara(outrasTexto);
        const totalRecebido = vSalario + vOutras;

        let dadosEdicao = JSON.parse(localStorage.getItem('dadosSimulacaoEdicao')) || {};
        
        // Atualiza a estrutura temporária do objeto
        dadosEdicao.recebido = totalRecebido;
        dadosEdicao.contrato = vSalario > 0 ? 'CLT' : 'Freelancer';
        dadosEdicao.detalheRendas = {
          salario: salarioTexto,
          outras: outrasTexto
        };

        localStorage.setItem('dadosSimulacaoEdicao', JSON.stringify(dadosEdicao));
        window.location.href = './Gastos.html';
      }
    </script>
  </body>
</html>
