<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Simulador Financeiro - Gastos</title>
    <link rel="stylesheet" href="CSS/EstiloRendas.css?v=10">
</head>
<body>
    <div class="centro">
        <h1 class="titulo">GASTOS</h1>
        <p class="frase">Insira os valores gastos nas categorias que você mais se encaixa.</p>
        
        <div class="grid-gastos">
            <div class="item-gasto"><label>Moradia (Aluguel, Luz...)</label><input type="text" id="Moradia" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)"></div>
            <div class="item-gasto"><label>Alimentação (Mercado, iFood...)</label><input type="text" id="Alimento" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)"></div>
            <div class="item-gasto"><label>Transporte (Combustível, Uber...)</label><input type="text" id="Transporte" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)"></div>
            <div class="item-gasto"><label>Saúde (Convênio, Farmácia...)</label><input type="text" id="Saude" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)"></div>
            <div class="item-gasto"><label>Assinaturas (Netflix, Spotify...)</label><input type="text" id="Assinaturas" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)"></div>
            <div class="item-gasto"><label>Lazer (Cinema, Viagem...)</label><input type="text" id="Lazer" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)"></div>
            <div class="item-gasto"><label>Educação (Faculdade, Curso...)</label><input type="text" id="Educacao" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)"></div>
            <div class="item-gasto"><label>Investimento</label><input type="text" id="Investimento" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)"></div>
            <div class="item-gasto"><label>Outros</label><input type="text" id="Outros" class="caixa" placeholder="R$ 0,00" oninput="formatarMoeda(this)"></div>
        </div>

        <button class="botao" onclick="finalizarEGuardarSimulacao()">CONTINUAR</button>
    </div>

    <script>
      function formatarMoeda(input) {
        let valor = input.value.replace(/\D/g, "");
        valor = (valor / 100).toFixed(2) + "";
        valor = valor.replace(".", ",");
        valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        input.value = valor ? "R$ " + valor : "";
      }

      function limparMascara(valorStr) {
        if (!valorStr) return 0;
        let limpo = valorStr.replace("R$", "").replace(/\./g, "").replace(",", ".").trim();
        return parseFloat(limpo) || 0;
      }

      const IDsCategorias = ["Moradia", "Alimento", "Transporte", "Saude", "Assinaturas", "Lazer", "Educacao", "Investimento", "Outros"];

      document.addEventListener("DOMContentLoaded", function() {
        const dadosSalvos = localStorage.getItem('dadosSimulacaoEdicao');
        
        if (dadosSalvos) {
          const dados = JSON.parse(dadosSalvos);
          if (dados.detalheGastos) {
            IDsCategorias.forEach(id => {
              document.getElementById(id).value = dados.detalheGastos[id] || "";
            });
          }
        } else {
          // Garante campos limpos em novas simulações convencionais
          IDsCategorias.forEach(id => {
            document.getElementById(id).value = "";
          });
        }
      });

      function finalizarEGuardarSimulacao() {
        let totalGastos = 0;
        let dicionarioGastos = {};

        IDsCategorias.forEach(id => {
          const campoTexto = document.getElementById(id).value;
          dicionarioGastos[id] = campoTexto;
          totalGastos += limparMascara(campoTexto);
        });

        // VALIDAÇÃO EXATA: Se a soma de todos os gastos for zero, impede o envio e exibe o alert
        if (totalGastos <= 0) {
          alert("Por favor, insira pelo menos um valor de gasto para conseguir finalizar.");
          return; // Aborta a execução para não salvar dados vazios e não mudar de página
        }

        let dadosEdicao = JSON.parse(localStorage.getItem('dadosSimulacaoEdicao')) || {};
        let listaSimulacoes = JSON.parse(localStorage.getItem('listaSimulacoes')) || [];
        const idAtivo = localStorage.getItem('idEmEdicao');

        dadosEdicao.gastos = totalGastos;
        dadosEdicao.sobra = (dadosEdicao.recebido || 0) - totalGastos;
        dadosEdicao.detalheGastos = dicionarioGastos;

        if (idAtivo) {
          listaSimulacoes = listaSimulacoes.map(item => item.id === parseInt(idAtivo) ? { ...item, ...dadosEdicao } : item);
          localStorage.removeItem('idEmEdicao');
        } else {
          const hoje = new Date();
          dadosEdicao.id = Date.now();
          dadosEdicao.data = hoje.toLocaleDateString('pt-BR', {year: '2-digit', month: '2-digit', day: '2-digit'});
          dadosEdicao.hora = hoje.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) + 'hs';
          listaSimulacoes.push(dadosEdicao);
        }

        localStorage.setItem('listaSimulacoes', JSON.stringify(listaSimulacoes));

        window.location.href = './PlanoAcao.html';
      }
    </script>
</body>
</html>
