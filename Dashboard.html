<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FMU - Dashboard</title>
  <link rel="stylesheet" href="./Pages/styles.css"/>
</head>
<body class="body-dashboard">
  
  <div class="dashboard-wrapper">
    <header>
      <h1>FMU</h1>
      <div class="profile-icon">👤</div>
    </header>

    <div class="simulacao-btn">
      <a href="./ProjetoDevWeb/simulador.html">Faça uma simulação agora!</a>
    </div>

    <div class="search-bar">
      <div class="filter-container">
        <button class="filter-btn" id="filter-main-btn" onclick="toggleFiltro(event)">Filtro</button>
        <div class="filter-menu" id="filter-dropdown"></div>
      </div>
      <input type="text" id="search-input" oninput="filtrarTabela()" placeholder="Procure a análise que você fez" />
    </div>

    <div id="aviso-vazio" class="sem-registro" style="display: none;">
      Nenhum registro encontrado
    </div>

    <table id="main-table">
      <thead>
        <tr>
          <th>Data</th>
          <th>Hora</th>
          <th>Contrato</th>
          <th>Valor Recebido</th>
          <th>Gastos</th>
          <th>Sobra</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script>
    let dataFiltroAtual = 'todas';

    document.addEventListener("DOMContentLoaded", function() {
      renderizarTabela();
    });

    function converterParaNumero(valor) {
      if (typeof valor === 'number') return valor;
      if (!valor) return 0;
      let limpo = valor.replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
      return parseFloat(limpo) || 0;
    }

    function renderizarTabela() {
      const lista = JSON.parse(localStorage.getItem('listaSimulacoes')) || [];
      const tbody = document.getElementById('table-body');
      const tabela = document.getElementById('main-table');
      const aviso = document.getElementById('aviso-vazio');
      
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tabela.style.display = 'none';
        aviso.style.display = 'block';
        atualizarOpcoesDeFiltro([]);
        return;
      }

      tabela.style.display = 'table';
      aviso.style.display = 'none';

      lista.forEach(reg => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-id', reg.id); 
        
        const vRecebido = converterParaNumero(reg.recebido);
        const vGastos = converterParaNumero(reg.gastos);
        const vSobra = converterParaNumero(reg.sobra);

        // ==========================================================================
        // ALTERAÇÃO APENAS NA EXIBIÇÃO DAS PALAVRAS DOS CONTRATOS
        // ==========================================================================
        let contratoFormatado = reg.contrato || 'Simulação';
        let contratoLimpo = contratoFormatado.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        
        if (contratoLimpo === 'clt') {
            contratoFormatado = 'CLT';
        } else {
            contratoFormatado = 'Estágio/Outros';
        }

        tr.innerHTML = `
          <td>${reg.data}</td>
          <td>${reg.hora || '12:00hs'}</td>
          <td>${contratoFormatado}</td>
          <td>R$ ${vRecebido.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
          <td>R$ ${vGastos.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
          <td>R$ ${vSobra.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
          <td>
            <div class="options" onclick="toggleMenuTresPontos(this, event)">⋮
              <div class="crud-menu">
                <button onclick="editarLinha(this, event)">Editar</button>
                <button onclick="deletarLinha(this, event)">Deletar</button>
              </div>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
      
      atualizarOpcoesDeFiltro(lista);
      filtrarTabela();
    }

    function atualizarOpcoesDeFiltro(lista) {
      const filterMenu = document.getElementById('filter-dropdown');
      if (!filterMenu) return;
      
      const datasEncontradas = new Set();
      lista.forEach(item => {
        if (item.data) datasEncontradas.add(item.data.trim());
      });

      let menuHTML = `<button onclick="selecionarFiltro('todas', 'Filtro', event)">Todas as datas</button>`;
      datasEncontradas.forEach(data => {
        menuHTML += `<button onclick="selecionarFiltro('${data}', '${data}', event)">${data}</button>`;
      });

      filterMenu.innerHTML = menuHTML;
    }

    function toggleFiltro(e) {
      e.stopPropagation();
      fecharTodosMenus();
      const menu = document.getElementById('filter-dropdown');
      menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function selecionarFiltro(valor, texto, e) {
      e.stopPropagation();
      dataFiltroAtual = valor;
      document.getElementById('filter-main-btn').innerHTML = valor === 'todas' ? 'Filtro' : `Data: ${texto}`;
      document.getElementById('filter-dropdown').style.display = 'none';
      filtrarTabela();
    }

    function filtrarTabela() {
      const textoBusca = document.getElementById('search-input').value.toLowerCase();
      const rows = document.querySelectorAll('#table-body tr');

      rows.forEach(row => {
        const firstCell = row.querySelector('td');
        if (!firstCell) return;

        const textoDaLinha = row.innerText.toLowerCase();
        const colunaData = firstCell.innerText.trim();

        const bateData = (dataFiltroAtual === 'todas' || colunaData === dataFiltroAtual);
        const bateTexto = textoDaLinha.includes(textoBusca);

        row.style.display = (bateData && bateTexto) ? '' : 'none';
      });
    }

    function toggleMenuTresPontos(elemento, e) {
      e.stopPropagation();
      const menuAtual = elemento.querySelector('.crud-menu');
      
      const dropdown = document.getElementById('filter-dropdown');
      if (dropdown) dropdown.style.display = 'none';
      
      document.querySelectorAll('.crud-menu').forEach(m => {
        if (m !== menuAtual) m.style.display = 'none';
      });

      menuAtual.style.display = (menuAtual.style.display === 'block') ? 'none' : 'block';
    }

    function deletarLinha(botao, e) {
      e.stopPropagation();
      const row = botao.closest('tr');
      const idDeletar = parseInt(row.getAttribute('data-id'));

      let lista = JSON.parse(localStorage.getItem('listaSimulacoes')) || [];
      lista = lista.filter(item => item.id !== idDeletar);
      localStorage.setItem('listaSimulacoes', JSON.stringify(lista));

      renderizarTabela();
    }

    function editarLinha(botao, e) {
      e.stopPropagation();
      const row = botao.closest('tr');
      const idEditar = parseInt(row.getAttribute('data-id'));
      
      let lista = JSON.parse(localStorage.getItem('listaSimulacoes')) || [];
      const registro = lista.find(item => item.id === idEditar);

      if (registro) {
        localStorage.setItem('idEmEdicao', idEditar);
        localStorage.setItem('dadosSimulacaoEdicao', JSON.stringify(registro));
        window.location.href = './ProjetoDevWeb/Rendas.html';
      }
    }

    function fecharTodosMenus() {
      document.querySelectorAll('.crud-menu').forEach(m => m.style.display = 'none');
      const dropdown = document.getElementById('filter-dropdown');
      if(dropdown) dropdown.style.display = 'none';
    }

    document.addEventListener('click', fecharTodosMenus);
  </script>
</body>
</html>
